name: Update Market Data (FRED, KPMG, NYU, SP500)

on:
  schedule:
    # Run monthly on the 1st at 06:00 UTC (한국시간 15:00)
    - cron: '0 6 1 * *'
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pandas lxml requests
      
      - name: Run market data collection
        run: python collect_market_data.py
      
      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add fred_data.csv sp500_monthly.csv kpmg_tax_rates.csv nyu_sp_earnings.csv
          git diff --cached --quiet || git commit -m "Auto-update market data [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
